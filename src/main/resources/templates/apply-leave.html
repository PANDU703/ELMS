
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Apply Leave | ELMS Pro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/dashboard">ELMS PRO</a>
        <a href="/dashboard" class="btn btn-light">Dashboard</a>
    </div>
</nav>

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h3>Apply Leave</h3>
        </div>

        <div class="card-body">

            <form id="leaveForm">

                <div class="mb-3">
                    <label class="form-label">Leave Type</label>

                    <select id="leaveTypeId"
                            class="form-select"
                            required>

                        <option value="">-- Select Leave Type --</option>

                    </select>
                </div>

                <!-- Medical certificate upload -->
                <div class="mb-3 d-none" id="certificateSection">

                    <label for="certificateFile" class="form-label">
                        Medical Certificate
                    </label>

                    <input type="file"
                           id="certificateFile"
                           class="form-control"
                           accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp">

                    <div class="form-text">
                        Required for Sick Leave. JPG, PNG or WEBP.
                        Maximum size: 8 MB.
                    </div>

                    <div class="alert alert-warning mt-2 mb-0">
                        The certificate will be screened using AI-assisted
                        OCR. The manager must manually review it.
                        Screening does not verify authenticity.
                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Start Date</label>

                        <input type="date"
                               id="startDate"
                               class="form-control"
                               required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">End Date</label>

                        <input type="date"
                               id="endDate"
                               class="form-control"
                               required>
                    </div>

                </div>

                <div class="mb-3">

                    <label class="form-label">Reason</label>

                    <textarea id="reason"
                              class="form-control"
                              rows="4"
                              required></textarea>

                </div>

                <button class="btn btn-primary" type="submit" id="submitButton">
                    Apply Leave
                </button>

            </form>

            <div id="message" class="mt-3" role="status" aria-live="polite"></div>

        </div>
    </div>
</div>

<script src="/js/apply-leave.js"></script>

</body>
</html>
