# ===============================
# Application Configuration
# ===============================
spring.application.name=employee-leave-management-system

# ===============================
# MySQL Database Configuration
# ===============================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/elms_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate Configuration
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Server Configuration
# ===============================
server.port=${PORT:8080}

# ===============================
# Mail Configuration
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Mail Logging
logging.level.org.springframework.mail=INFO
logging.level.org.eclipse.angus.mail=INFO

# ===============================
# Medical Certificate Screening
# ===============================
medical.ai.url=${MEDICAL_AI_URL:http://127.0.0.1:8000/screen}

spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB

# ===============================
# Private Medical Certificate Storage
# ===============================
medical.certificate.storage-dir=${MEDICAL_CERTIFICATE_STORAGE_DIR:./private-uploads/medical-certificates}
